name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ArtFruit.app
        run: |
          cd ArtFruit
          bash build.sh

      - name: Create .zip
        run: |
          cd ArtFruit/.build
          zip -r --symlinks "../../ArtFruit-${{ github.ref_name }}.zip" ArtFruit.app
          echo "ZIP created: ArtFruit-${{ github.ref_name }}.zip"

      - name: Create .dmg
        run: |
          # Stage the .app in a temp folder alongside an Applications symlink
          mkdir -p /tmp/dmg-staging
          cp -R ArtFruit/.build/ArtFruit.app /tmp/dmg-staging/
          ln -s /Applications /tmp/dmg-staging/Applications

          # Create a writable intermediate DMG, then convert to compressed read-only
          hdiutil create \
            -volname "ArtFruit" \
            -srcfolder /tmp/dmg-staging \
            -ov -format UDRW \
            /tmp/ArtFruit-rw.dmg

          hdiutil convert /tmp/ArtFruit-rw.dmg \
            -format UDZO \
            -o "ArtFruit-${{ github.ref_name }}.dmg"

          echo "DMG created: ArtFruit-${{ github.ref_name }}.dmg"

      - name: Create GitHub Release (macOS artifacts)
        uses: softprops/action-gh-release@v2
        with:
          name: "ArtFruit ${{ github.ref_name }}"
          body: |
            ## ArtFruit ${{ github.ref_name }}

            ### What's new in 1.1.3

            - **Artist filter — Windows** — The Preferences window now has an **Artists** tab on Windows, matching the feature already available on macOS. Check one or more artists to limit wallpapers to their work. Artists available in both the Art Institute of Chicago and WikiArt are tagged **ARTIC · WikiArt**; others are tagged **ARTIC**. Leave all unchecked to show artwork from any artist.

            ---

            ### macOS

            **Option A — Zip:**
            Download `ArtFruit-${{ github.ref_name }}.zip`, unzip, and drag `ArtFruit.app` to your Applications folder.

            **Option B — DMG:**
            Download `ArtFruit-${{ github.ref_name }}.dmg`, open it, and drag `ArtFruit.app` to the Applications shortcut.

            #### First launch (Gatekeeper)
            Because this app is not notarized, macOS will block it on first launch.
            To open it anyway:
            ```
            xattr -dr com.apple.quarantine /Applications/ArtFruit.app
            ```
            Or: right-click `ArtFruit.app` → **Open** → **Open**.

            ### Windows

            Download `ArtFruit-${{ github.ref_name }}-Windows-x64.zip`, unzip, and run
            `ArtFruit.exe`. It's self-contained (no .NET install required) and runs from
            the system tray. Windows SmartScreen may warn on first launch because the exe
            is unsigned — click **More info → Run anyway**.
          files: |
            ArtFruit-${{ github.ref_name }}.zip
            ArtFruit-${{ github.ref_name }}.dmg
          draft: false
          prerelease: false

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach assets to the Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ArtFruit.exe (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish artfruit_windows/ArtFruit.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o artfruit_windows/bin/publish

      - name: Package Windows zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artfruit_windows/bin/publish/ArtFruit.exe `
            -DestinationPath "ArtFruit-${{ github.ref_name }}-Windows-x64.zip"
          Write-Host "ZIP created: ArtFruit-${{ github.ref_name }}-Windows-x64.zip"

      - name: Upload Windows artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ArtFruit-${{ github.ref_name }}-Windows-x64.zip
          draft: false
          prerelease: false
