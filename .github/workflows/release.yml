name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ArtFruit.app
        run: |
          cd ArtFruit
          bash build.sh

      - name: Verify code signature
        run: |
          # Fail the build rather than shipping a bundle with a broken seal.
          # A malformed signature makes macOS show the dead-end "ArtFruit.app is
          # damaged and can't be opened" dialog, which gives users no way to proceed.
          codesign --verify --strict --verbose=2 ArtFruit/.build/ArtFruit.app

      - name: Create .zip
        run: |
          # Use ditto rather than zip: it is the Apple-recommended way to archive a
          # signed .app, preserving the code signature and extended attributes.
          ditto -c -k --sequesterRsrc --keepParent \
            ArtFruit/.build/ArtFruit.app \
            "ArtFruit-${{ github.ref_name }}.zip"
          echo "ZIP created: ArtFruit-${{ github.ref_name }}.zip"

      - name: Create .dmg
        run: |
          # Stage the .app in a temp folder alongside an Applications symlink
          mkdir -p /tmp/dmg-staging
          ditto ArtFruit/.build/ArtFruit.app /tmp/dmg-staging/ArtFruit.app
          ln -s /Applications /tmp/dmg-staging/Applications

          # Create a writable intermediate DMG, then convert to compressed read-only
          hdiutil create \
            -volname "ArtFruit" \
            -srcfolder /tmp/dmg-staging \
            -ov -format UDRW \
            /tmp/ArtFruit-rw.dmg

          hdiutil convert /tmp/ArtFruit-rw.dmg \
            -format UDZO \
            -o "ArtFruit-${{ github.ref_name }}.dmg"

          echo "DMG created: ArtFruit-${{ github.ref_name }}.dmg"

      - name: Create GitHub Release (macOS artifacts)
        uses: softprops/action-gh-release@v2
        with:
          name: "ArtFruit ${{ github.ref_name }}"
          body: |
            ## ArtFruit ${{ github.ref_name }}

            ### What's new in 1.1.5

            - **WikiArt is now the sole artwork source** — The Art Institute of Chicago
              API was removed. The AIC's image delivery server blocked non-browser
              User-Agents, making reliable operation impossible without spoofing headers.
              WikiArt has a much larger public-domain catalogue and no such restrictions.
            - **Sources tab removed** from Preferences on both macOS and Windows — with
              only one source there's nothing to choose between, so the tab was cleaned up.
            - **Style and Artist badges** simplified — labels now show **WikiArt** where
              supported, or nothing, instead of the old ARTIC / ARTIC · WikiArt distinction.

            ### Previously, in 1.1.4

            - **Fixed: "ArtFruit.app is damaged and can't be opened" on macOS** — The
              build assembled the app bundle without re-signing it, leaving an invalid
              code signature. macOS treats a *broken* signature more harshly than an
              unsigned app, showing a dead-end error with no way to proceed. The bundle
              is now correctly signed and signature-verified in CI, so first launch
              follows the normal **Open Anyway** flow described below.
            - macOS install instructions updated for macOS Sequoia and later, where the
              old "right-click ▸ Open" shortcut no longer works.

            ---

            ### macOS

            **Option A — Zip:**
            Download `ArtFruit-${{ github.ref_name }}.zip`, unzip, and drag `ArtFruit.app` to your Applications folder.

            **Option B — DMG:**
            Download `ArtFruit-${{ github.ref_name }}.dmg`, open it, and drag `ArtFruit.app` to the Applications shortcut.

            #### ⚠️ First launch — please read

            ArtFruit isn't notarized by Apple (that requires a paid Apple Developer
            account), so macOS blocks it the first time. **This is expected, and it
            only happens once.** Here's how to open it:

            1. Drag `ArtFruit.app` to **Applications**, then double-click it.
            2. macOS shows a message saying the app can't be opened. Click **Done**.
            3. Open **System Settings** ▸ **Privacy & Security**.
            4. Scroll down to the **Security** section. You'll see
               *"ArtFruit.app was blocked to protect your Mac."* Click **Open Anyway**.
            5. Confirm with **Open Anyway** and authenticate with Touch ID or your password.

            ArtFruit lives in the **menu bar** (look for its icon at the top-right of
            your screen), not the Dock — it has no window of its own.

            From then on it opens normally.

            > **Note:** On macOS Sequoia (15) and later, the old "right-click ▸ Open"
            > shortcut no longer works — you must use System Settings as described above.

            <details>
            <summary>Prefer the Terminal? (optional, one command)</summary>

            ```
            xattr -dr com.apple.quarantine /Applications/ArtFruit.app
            ```
            </details>

            ### Windows

            Download `ArtFruit-${{ github.ref_name }}-Windows-x64.zip`, unzip, and run
            `ArtFruit.exe`. It's self-contained (no .NET install required) and runs from
            the system tray. Windows SmartScreen may warn on first launch because the exe
            is unsigned — click **More info → Run anyway**.
          files: |
            ArtFruit-${{ github.ref_name }}.zip
            ArtFruit-${{ github.ref_name }}.dmg
          draft: false
          prerelease: false

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach assets to the Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ArtFruit.exe (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish artfruit_windows/ArtFruit.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o artfruit_windows/bin/publish

      - name: Package Windows zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artfruit_windows/bin/publish/ArtFruit.exe `
            -DestinationPath "ArtFruit-${{ github.ref_name }}-Windows-x64.zip"
          Write-Host "ZIP created: ArtFruit-${{ github.ref_name }}-Windows-x64.zip"

      - name: Upload Windows artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ArtFruit-${{ github.ref_name }}-Windows-x64.zip
          draft: false
          prerelease: false
